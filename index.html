<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokemon Battle - Krishna</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Pokemon Battles </h1>

  <div class="choices">
    <div class="choice" id="squirtle">
      <img src="./assests/water.webp" alt="Squirtle">
    </div>

    <div class="choice" id="bulbasaur">
      <img src="./assests/grass.webp" alt="Bulbasaur">
    </div>

    <div class="choice" id="charmander">
      <img src="./assests/fire.png" alt="Charmander">
    </div>
  </div>

  <div class="score-board">
    <div class="score">
      <p id="user-score">0</p>
      <p>You</p>
    </div>

    <div class="score">
      <p id="comp-score">0</p>
      <p>Computer</p>
    </div>
  </div>

  <div class="msg-container">
    <p id="msg">Choose your Pokémon!</p>
  </div>

  <script src="app.js"></script>

</body>
</html>
